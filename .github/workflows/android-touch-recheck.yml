name: Verify existing Hybrid APK
on:
  push:
    paths: ['.github/workflows/android-touch-recheck.yml']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful native build run containing atlas-hybrid-android-apk'
        required: true
        default: '43578254897'
permissions:
  contents: read
  actions: read
jobs:
  android-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-hybrid-android-apk
          path: apk
          run-id: ${{ inputs.source_run_id || '43578254897' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed app with Android touches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu lavapipe -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          pre-emulator-launch-script: adb start-server
          script: |
            adb install -r $(find apk -name '*-Signed.apk' -print -quit)
            python mobile/tests/android_touch_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-hybrid-android-touch-results
          path: android-smoke-results/**
