name: MAUI Hybrid CI
on:
  push:
    paths: ['mobile/**', '.github/workflows/maui-ci.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/maui-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m unittest discover -s mobile/tests -p "test_android_smoke_diagnostics.py"
      - run: node --test mobile/tests/orb_renderer.test.mjs
      - run: dotnet test mobile/Atlas.Core.Tests/Atlas.Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - run: dotnet build mobile/Atlas.UI/Atlas.UI.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-hybrid-test-results
          path: TestResults/**
  visual:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project mobile/tests/Atlas.VisualChecks/Atlas.VisualChecks.csproj --configuration Release -- visual-results
      - run: |
          cp mobile/Atlas.UI/wwwroot/atlas.css visual-results/atlas.css
          mkdir -p visual-results/_content/Atlas.UI
          cp -R mobile/Atlas.UI/wwwroot/. visual-results/_content/Atlas.UI/
      - run: pip install playwright==1.55.0
      - run: python mobile/tests/visual_check.py visual-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-hybrid-visual-results
          path: visual-results/**
  native:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android maui-windows
      - name: Install required Android SDK components
        run: dotnet build mobile/Atlas.Mobile/Atlas.Mobile.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True
      - name: Build installable Android APK
        run: dotnet build mobile/Atlas.Mobile/Atlas.Mobile.csproj -f net10.0-android -c Debug -p:AndroidPackageFormats=apk -p:EmbedAssembliesIntoApk=true
      - name: Compile Windows host
        run: dotnet build mobile/Atlas.Mobile/Atlas.Mobile.csproj -f net10.0-windows10.0.19041.0 -c Debug
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-hybrid-android-apk
          path: mobile/Atlas.Mobile/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
  android-touch:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-hybrid-android-apk
          path: apk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client==1.8.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed app with Android touches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          pre-emulator-launch-script: adb start-server
          script: |
            adb install -r $(find apk -name '*-Signed.apk' -print -quit)
            python mobile/tests/android_touch_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-hybrid-android-touch-results
          path: android-smoke-results/**
