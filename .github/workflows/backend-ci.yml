name: Backend CI
on:
  push:
    paths: ['backend/**', 'deployment/**', 'render.api.yaml', '.python-version', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', 'deployment/**', 'render.api.yaml', '.python-version', '.github/workflows/backend-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: python -m unittest discover -s backend/atlas/tests -v
      - run: bash -n deployment/render/*.sh
